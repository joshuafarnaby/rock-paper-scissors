<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="./style/style.css">
    <link rel="stylesheet" href="./style/modal-style.css">
    <link rel="stylesheet" href="./style/game-launch-modal.css">
    <link rel="stylesheet" href="./style/round-result-modal.css">
    <link rel="stylesheet" href="./style/game-over-modal.css">
    <title>Rock, Paper, Scissors</title>
</head>
<body>
    <div class="score-container">
        Player <span id="player-score">0</span> - <span id="computer-score">0</span> Computer
    </div>
    <div class="rps-select-container">
        <button id="rock-btn" value="rock"><img src="./icons/hand-fist-solid.svg"></button>
        <button id="paper-btn" value="paper"><img src="./icons/hand-solid.svg"></button>
        <button id="scissors-btn" value="scissors"><img src="./icons/hand-scissors-solid.svg"></button>
    </div>


    <div id="game-launch-container" class="modal-background reveal">
        <div id="game-launch-modal" class="modal">
            <h2>Welcome! Select the number of rounds:</h2>
            <div id="round-select-container" class="round-select-container">
                <button id="one" class="round-select-btn">one</button>
                <button id="three" class="round-select-btn">three</button>
                <button id="five" class="round-select-btn">five</button>
            </div>
            <button id="play-game-btn" class="play-game-btn inactive">Play Game</button>
        </div>
    </div>

    <div id="round-result-container" class="modal-background hidden">
        <div id="round-result-modal" class="modal">
            <div class="choice-container">
                <div>
                    <h2>player chose <span id="player-choice-text">rock</span></h2>
                    <img src="./icons/hand-fist-solid.svg" alt="">
                </div>
                <div>
                    <h2>computer chose <span id="computer-choice-text">scissors</span></h2>
                    <img src="./icons/hand-scissors-solid.svg" alt="">
                </div>
            </div>
            <h2>the winner of round <span id="round-count">1</span> is the <span id="round-winner text">player</span>!</h2>
            <div class="quit-continue-btn-container">
                <button id="quit-btn" class="quit-btn">quit game</button>
                <button id="next-round-btn" class="next-round-btn">next round</button>
            </div>
        </div>
    </div>

    <div id="game-over-container" class="modal-background hidden">
        <div id="game-over-modal" class="modal">
            <h2>game over!</h2>
            <h2>
                player <span id="player-final">0</span> - <span id="computer-final">0</span> computer
            </h2>
            <h2>the winner is the <span id="winner">player</span>!</h2>
            <div class="home-replay-btn-container">
                <button id="home-btn" class="home-btn">home</button>
                <button id="replay-btn" class="replay-btn">replay</button>
            </div>
        </div>
    </div>
</body>
</html>
