<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock, Paper, Scissors</title>
    <script src="script.js" defer></script>
</head>
<body>
    <div id="game-launch-container" class="modal-background">
        <div id="game-launch-modal" class="modal">
            <h2>Welcome! Select the number of rounds:</h2>
            <div id="round-select-container">
                <button id="one" class="round-select-btn">
                    <img src="./icons/one.svg" alt="the number one in a square">
                </button>
                <button id="two" class="round-select-btn">
                    <img src="./icons/three.svg" alt="the number three in a square">
                </button>
                <button id="three" class="round-select-btn">
                    <img src="./icons/five.svg" alt="the number five in a square">
                </button>
            </div>
            <button id="play-game-btn">Play Game</button>
        </div>
    </div>
    
</body>
</html>
