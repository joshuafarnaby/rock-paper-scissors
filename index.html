<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="./style/style.css">
    <link rel="stylesheet" href="./style/modal-style.css">
    <link rel="stylesheet" href="./style/game-launch-modal.css">
    <title>Rock, Paper, Scissors</title>
</head>
<body>
    <div class="score-container">
        Player <span id="player-score">0</span> - <span id="computer-score">0</span> Computer
    </div>
    <div class="rps-select-container">
        <button id="rock-btn"><img src="./icons/hand-fist-solid.svg"></button>
        <button id="paper-btn"><img src="./icons/hand-solid.svg"></button>
        <button id="scissors-btn"><img src="./icons/hand-scissors-solid.svg"></button>
    </div>


    <div id="game-launch-container" class="modal-background hidden">
        <div id="game-launch-modal" class="modal">
            <h2>Welcome! Select the number of rounds:</h2>
            <div id="round-select-container" class="round-select-container">
                <button id="one" class="round-select-btn">one</button>
                <button id="three" class="round-select-btn">three</button>
                <button id="five" class="round-select-btn">five</button>
            </div>
            <button id="play-game-btn" class="play-game-btn">Play Game</button>
        </div>
    </div>

    <!-- <div id="round-result-container" class="modal-background hidden"></div> -->
</body>
</html>
